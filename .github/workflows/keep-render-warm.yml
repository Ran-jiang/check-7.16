name: keep-render-warm

on:
  workflow_dispatch:
  schedule:
    # Render 免费档约 15 分钟无流量即休眠,每 10 分钟探活一次保持唤醒。
    # 避开整点/整十分(:00/:30 是 GitHub 定时任务高峰,极易被延迟或丢弃),错开 4 分钟。
    - cron: "4,14,24,34,44,54 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping public API health
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 90 https://cciteheck-api.onrender.com/api/health)
          echo "health status: $code"
          [ "$code" = "200" ] || exit 1
